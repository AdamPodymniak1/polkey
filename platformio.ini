; Shared defaults — PlatformIO applies this to every [env:*] section below
; unless that section overrides a key outright.
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I lib/commons
    -I lib/ML-DSA44
    -I lib/ML-DSA65
    -I lib/ML-DSA87
    ; Arduino core 3.3.x USB library (USBHostMSC.cpp -> USBMSCFS.h) includes
    ; "FS.h", but PlatformIO's LDF does not export framework library
    ; dependencies to other framework libraries, so add it explicitly.
    -I "$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/FS/src"
lib_deps =
    bblanchon/ArduinoJson@^7.3.0
    lovyan03/LovyanGFX@^1.1.16
    adafruit/Adafruit Fingerprint Sensor Library @ ^2.1.3
    olikraus/U8g2@^2.35.4
    rweather/Crypto@^0.4.0

[variant_base]
build_flags = ${env.build_flags}

[opt_pm]
build_flags = -D FEATURE_PASSWORD_MANAGER=1
[opt_fido]
build_flags = -D FEATURE_PASSWORD_MANAGER=0
[opt_fp]
build_flags = -D USER_AUTH_FINGERPRINT
[opt_btn]
build_flags = -D USER_AUTH_BUTTON -D AUTH_BUTTON_PIN=8
[opt_oled]
build_flags = -D FEATURE_OLED=1
[opt_nooled]
build_flags = -D FEATURE_OLED=0

; ---------------------------------------------------------------------------
; RELEASE build. This is what ships. No provisioning command compiled in
; PROVISION_ATTESTATION does not exist in this binary.
; ---------------------------------------------------------------------------
[env:esp32s3]
build_flags = ${variant_base.build_flags} ${opt_pm.build_flags} ${opt_fp.build_flags} ${opt_oled.build_flags}

[env:pm-fp-oled]
build_flags = ${variant_base.build_flags} ${opt_pm.build_flags} ${opt_fp.build_flags} ${opt_oled.build_flags}
[env:pm-fp-nooled]
build_flags = ${variant_base.build_flags} ${opt_pm.build_flags} ${opt_fp.build_flags} ${opt_nooled.build_flags}
[env:pm-btn-oled]
build_flags = ${variant_base.build_flags} ${opt_pm.build_flags} ${opt_btn.build_flags} ${opt_oled.build_flags}
[env:pm-btn-nooled]
build_flags = ${variant_base.build_flags} ${opt_pm.build_flags} ${opt_btn.build_flags} ${opt_nooled.build_flags}
[env:fido-fp-oled]
build_flags = ${variant_base.build_flags} ${opt_fido.build_flags} ${opt_fp.build_flags} ${opt_oled.build_flags}
[env:fido-fp-nooled]
build_flags = ${variant_base.build_flags} ${opt_fido.build_flags} ${opt_fp.build_flags} ${opt_nooled.build_flags}
[env:fido-btn-oled]
build_flags = ${variant_base.build_flags} ${opt_fido.build_flags} ${opt_btn.build_flags} ${opt_oled.build_flags}
[env:fido-btn-nooled]
build_flags = ${variant_base.build_flags} ${opt_fido.build_flags} ${opt_btn.build_flags} ${opt_nooled.build_flags}

; ---------------------------------------------------------------------------
; BENCH/DEV build. Same firmware, plus the PROVISION_ATTESTATION JSON
; command from AttestationProvisioningCmd.cpp. Use this only on your own
; test hardware, never flash an esp32s3-bench build to a device that will
; leave the bench, since it lets anyone who has (or phishes) the PIN
; rewrite the device's attestation identity over USB.
;
;   pio run -e esp32s3-bench -t upload
; ---------------------------------------------------------------------------
[env:esp32s3-bench]
build_flags = ${env:esp32s3.build_flags} -D ALLOW_ATTESTATION_PROVISIONING_CMD
